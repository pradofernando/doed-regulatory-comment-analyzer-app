# azd project descriptor for the .NET 9 Blazor Server web frontend.
# Run `azd up` from this directory (dotnet_frontend/).
#
# Required env vars (set via `azd env set ...` or `.azure/<env>/.env`):
#   REGS_API_KEY                    - Regulations.gov v4 API key
#   FOUNDRY_PROJECT_ENDPOINT        - Foundry project endpoint URL
#   FOUNDRY_CATEGORIZATION_AGENT_NAME    - published categorization prompt-agent name
#   FOUNDRY_CATEGORIZATION_AGENT_VERSION - categorization prompt-agent version
#   FOUNDRY_GROUPING_AGENT_NAME          - published grouping prompt-agent name
#   FOUNDRY_GROUPING_AGENT_VERSION       - grouping prompt-agent version
#   FOUNDRY_FOLLOWUP_AGENT_NAME          - follow-up prompt-agent name (optional)
#   FOUNDRY_FOLLOWUP_AGENT_VERSION       - follow-up prompt-agent version (optional)
#   FOUNDRY_MODEL_DEPLOYMENT        - model deployment name (default: gpt-5.4)
#
# Quick start:
#   cd dotnet_frontend
#   azd auth login --tenant-id <tenant-id>
#   azd env new doed-comments-<unique-suffix> --no-prompt
#   azd env set AZURE_SUBSCRIPTION_ID <subscription-id>
#   azd env set AZURE_LOCATION eastus
#   azd env set REGS_API_KEY <your-key>
#   azd env set FOUNDRY_PROJECT_ENDPOINT https://...
#   azd env set FOUNDRY_CATEGORIZATION_AGENT_NAME RegulatoryCommentCategorizationAgent
#   azd env set FOUNDRY_GROUPING_AGENT_NAME RegulatoryCommentGroupingAgent
#   azd env set FOUNDRY_FOLLOWUP_AGENT_NAME RegulatoryCommentFollowUpAgent
#   azd provision --preview --no-prompt
#   azd package --no-prompt
#   azd up
#
# See DEPLOYMENT.md for persistence profiles, optional services, RBAC, verification,
# security hardening, migration, backup, rollback, and troubleshooting.
#
# After the first `azd up`, copy the `foundryRoleAssignmentCommand` from the
# deployment outputs and run it once to grant the web app's managed identity
# the "Azure AI User" role on the Foundry project (this lives in a different
# RG, so it isn't part of this template).

name: doed-regulatory-comments-web
metadata:
  template: doed-regulatory-comments-web@1.0.0

services:
  web:
    project: .
    language: dotnet
    host: appservice
