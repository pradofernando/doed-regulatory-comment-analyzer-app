name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Build, test, and evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore dotnet_frontend.Tests/DoedRegulatoryComments.Web.Tests.csproj

      - name: Build release
        run: dotnet build dotnet_frontend.Tests/DoedRegulatoryComments.Web.Tests.csproj --configuration Release --no-restore

      - name: Run deterministic AI evaluation
        run: dotnet test dotnet_frontend.Tests/DoedRegulatoryComments.Web.Tests.csproj --configuration Release --no-build --filter Category=AiEvaluation --logger "trx;LogFileName=ai-evaluation.trx"

      - name: Run tests
        run: dotnet test dotnet_frontend.Tests/DoedRegulatoryComments.Web.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Audit NuGet dependencies
        shell: bash
        run: |
          dotnet list dotnet_frontend/DoedRegulatoryComments.Web.csproj package --vulnerable --include-transitive --format json > nuget-audit.json
          cat nuget-audit.json
          vulnerability_count=$(jq '[.projects[].frameworks[]? | ((.topLevelPackages // []) + (.transitivePackages // []))[]? | .vulnerabilities[]?] | length' nuget-audit.json)
          if [ "$vulnerability_count" -ne 0 ]; then
            echo "Found $vulnerability_count vulnerable NuGet package advisory entries."
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: dotnet_frontend.Tests/TestResults/*.trx
          if-no-files-found: warn

  bicep:
    name: Validate Bicep
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile Bicep
        uses: azure/CLI@v2
        env:
          # Placeholder only. foundryProjectEndpoint is @minLength(1), so compilation fails when unset.
          FOUNDRY_PROJECT_ENDPOINT: https://placeholder.services.ai.azure.com/api/projects/placeholder
        with:
          inlineScript: |
            az bicep build --file dotnet_frontend/infra/main.bicep --outfile /tmp/main.json
            az bicep build-params --file dotnet_frontend/infra/main.bicepparam --outfile /tmp/main.parameters.json
            az bicep build --file azure_func_v2/infra/main.bicep --outfile /tmp/function-main.json

  function-contracts:
    name: Function and agent deployment contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore declared dependencies
        run: python -m pip install -r azure_func_v2/doed_regulatory_comments_func/requirements.txt -r azure_func_v2/infra/requirements-agent-creation.txt
      - name: Verify Function contracts without cloud calls
        working-directory: azure_func_v2/doed_regulatory_comments_func
        run: python -m unittest test_comment_consolidation test_structured_responses test_source_evidence
      - name: Verify agent definitions without cloud calls
        working-directory: azure_func_v2/infra
        run: python -m unittest test_create_foundry_agents test_deployment_contracts
